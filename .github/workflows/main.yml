name: Build ArmorPaint (Fixed Matrix Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone ArmorPaint Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Unpack V8 Engine (Modern Path)
        shell: powershell
        run: |
          $v8_archive = Get-ChildItem -Path . -Filter "v8_monolith.7z" -Recurse | Select-Object -First 1
          if ($v8_archive) {
              Write-Host "Found V8 archive at: $($v8_archive.FullName)"
              $target_dir = $v8_archive.DirectoryName
              cd $target_dir
              7z x v8_monolith.7z -aoa
              Remove-Item v8_monolith.7z
              Write-Host "V8 extracted successfully."
          } else {
              Write-Host "v8_monolith.7z not found. Skipping."
          }

      - name: Generate Project Solution
        run: |
          # Сучасний офіційний спосіб генерації рішень в екосистемі ArmorPaint
          node base/make -g direct3d11

      - name: Diagnose and Compile Solution
        shell: powershell
        run: |
          # Виводимо список усіх згенерованих файлів .sln для діагностики
          Write-Host "Searching for generated solution files..."
          Get-ChildItem -Path . -Filter "*.sln" -Recurse | ForEach-Object { Write-Host "Found: $($_.FullName)" }

          # Шукаємо файл рішення .sln
          $sln_file = Get-ChildItem -Path . -Filter "*.sln" -Recurse | Select-Object -First 1
          
          if ($sln_file) {
              Write-Host "🚀 Compiling solution file: $($sln_file.FullName)"
              msbuild $($sln_file.FullName) /p:Configuration=Release /p:Platform=x64
          } else {
              # Фолбек: якщо не знайшло в корені, шукаємо суто в папці build/
              if (Test-Path -Path "build") {
                  Write-Host "Contents of build folder:"
                  Get-ChildItem -Path "build"
              }
              Write-Error "❌ Error: No .sln project file was generated! Check base/make logs above."
              exit 1
          }

      - name: Assemble Ready-to-Run Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist/ArmorPaint"

          # Шукаємо скомпільований .exe файл у Release
          $exe_file = Get-ChildItem -Path . -Filter "*.exe" -Recurse | Where-Object { $_.FullName -like "*Release*" } | Select-Object -First 1
          if ($exe_file) {
              Write-Host "Found compiled executable at: $($exe_file.FullName)"
              Copy-Item -Path $exe_file.FullName -Destination "dist/ArmorPaint/ArmorPaint.exe"
          } else {
              Write-Error "❌ Compiled executable (.exe) not found!"
          }

          # Переносимо інтерфейс, шейдери та згенеровані скрипти програми (тека krom або схожа)
          $krom_folder = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse | Where-Object { $_.FullName -like "*build*" } | Select-Object -First 1
          if (-not $krom_folder) {
              $krom_folder = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse | Select-Object -First 1
          }
          
          if ($krom_folder) {
              Write-Host "Found resources folder at: $($krom_folder.FullName)"
              Copy-Item -Path "$($krom_folder.FullName)/*" -Destination "dist/ArmorPaint" -Recurse -Force
          }

          Write-Host "All components packed into dist/ArmorPaint!"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-Ready
          path: dist/ArmorPaint/
