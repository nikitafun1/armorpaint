name: Build ArmorPaint (Windows Fixed CMD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone ArmorPaint Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Unpack V8 Engine (If Present)
        shell: powershell
        run: |
          $v8_archive = Get-ChildItem -Path . -Filter "v8_monolith.7z" -Recurse | Select-Object -First 1
          if ($v8_archive) {
              Write-Host "Found V8 archive at: $($v8_archive.FullName)"
              cd $v8_archive.DirectoryName
              7z x v8_monolith.7z -aoa
              Remove-Item v8_monolith.7z
          }

      - name: Generate Project Solution
        working-directory: paint
        shell: cmd
        run: |
          ..\base\make.bat

      - name: Locate and Compile Solution
        shell: powershell
        run: |
          # Шукаємо згенерований файл .sln або .vcxproj
          $proj_file = Get-ChildItem -Path . -Include "*.sln", "*.vcxproj" -Recurse | Select-Object -First 1
          
          if ($proj_file) {
              Write-Host "🚀 Found project file at: $($proj_file.FullName)"
              msbuild $($proj_file.FullName) /p:Configuration=Release /p:Platform=x64
          } else {
              Write-Host "Contents of paint directory for diagnostics:"
              Get-ChildItem -Path paint -Recurse -Depth 2 | Select-Object FullName
              Write-Error "❌ Error: No .sln or .vcxproj project file was generated!"
              exit 1
          }

      - name: Assemble Ready-to-Run Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist/ArmorPaint"

          # 1. Копіюємо скомпільований ArmorPaint.exe
          $exe_file = Get-ChildItem -Path . -Filter "*.exe" -Recurse | Where-Object { $_.FullName -like "*Release*" -or $_.FullName -like "*out*" } | Select-Object -First 1
          if ($exe_file) {
              Write-Host "Found executable: $($exe_file.FullName)"
              Copy-Item -Path $exe_file.FullName -Destination "dist/ArmorPaint/ArmorPaint.exe"
          } else {
              Write-Error "❌ Compiled executable (.exe) not found!"
              exit 1
          }

          # 2. Копіюємо згенеровані асети та шейдери (у нових версіях це build/out/data або build/krom)
          $out_data = Get-ChildItem -Path . -Directory -Filter "data" -Recurse | Where-Object { $_.FullName -like "*build*" } | Select-Object -First 1
          $krom_dir = Get-ChildItem -Path . -Directory -Filter "krom" -Recurse | Where-Object { $_.FullName -like "*build*" } | Select-Object -First 1

          if ($out_data) {
              Write-Host "Copying resources from build/out: $($out_data.Parent.FullName)"
              Copy-Item -Path "$($out_data.Parent.FullName)/*" -Destination "dist/ArmorPaint" -Recurse -Force
          } elseif ($krom_dir) {
              Write-Host "Copying resources from krom: $($krom_dir.FullName)"
              Copy-Item -Path "$($krom_dir.FullName)/*" -Destination "dist/ArmorPaint" -Recurse -Force
          }

          Write-Host "✅ Package assembled successfully!"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-Ready
          path: dist/ArmorPaint/
