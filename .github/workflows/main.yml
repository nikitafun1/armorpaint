name: Build ArmorPaint (Windows Working Directory Fix)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone ArmorPaint Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Unpack V8 Engine (Modern Path)
        shell: powershell
        run: |
          # Автоматично шукаємо v8_monolith.7z у субмодулях та розпаковуємо його
          $v8_archive = Get-ChildItem -Path . -Filter "v8_monolith.7z" -Recurse | Select-Object -First 1
          if ($v8_archive) {
              Write-Host "Found V8 archive at: $($v8_archive.FullName)"
              $target_dir = $v8_archive.DirectoryName
              cd $target_dir
              7z x v8_monolith.7z -aoa
              Remove-Item v8_monolith.7z
              Write-Host "V8 extracted successfully."
          } else {
              Write-Host "v8_monolith.7z not found. Skipping."
          }

      - name: Generate Visual Studio Solution
        working-directory: paint
        run: |
          ..\base\make

      - name: Compile ArmorPaint (MSBuild)
        working-directory: paint/build
        run: |
          msbuild ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

      - name: Assemble Ready-to-Run Package
        shell: powershell
        run: |
          # Створюємо чисту теку для вашого готового дистрибутива
          New-Item -ItemType Directory -Force -Path "dist/ArmorPaint"

          # Скопіюємо скомпільований файл .exe (він має лежати у paint/build/x64/Release/)
          if (Test-Path -Path "paint/build/x64/Release/ArmorPaint.exe") {
              Copy-Item -Path "paint/build/x64/Release/ArmorPaint.exe" -Destination "dist/ArmorPaint/ArmorPaint.exe"
          } elseif (Test-Path -Path "paint/build/x64/Release/Krom.exe") {
              Copy-Item -Path "paint/build/x64/Release/Krom.exe" -Destination "dist/ArmorPaint/ArmorPaint.exe"
          }

          # Переносимо інтерфейс, шейдери та скрипти (вони створюються в paint/build/krom/)
          if (Test-Path -Path "paint/build/krom") {
              Copy-Item -Path "paint/build/krom/*" -Destination "dist/ArmorPaint" -Recurse -Force
          }

          Write-Host "All files successfully packed into dist/ArmorPaint!"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-Ready
          path: dist/ArmorPaint/
