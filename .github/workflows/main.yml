name: Build ArmorPaint (Windows Fixed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Clone ArmorPaint Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Unpack V8 Engine (Modern Path)
        shell: powershell
        run: |
          # Автоматичний пошук файлу v8_monolith.7z, де б він не лежав у субмодулях
          $v8_archive = Get-ChildItem -Path . -Filter "v8_monolith.7z" -Recurse | Select-Object -First 1
          if ($v8_archive) {
              Write-Host "Found V8 archive at: $($v8_archive.FullName)"
              $target_dir = $v8_archive.DirectoryName
              cd $target_dir
              7z x v8_monolith.7z -aoa
              Remove-Item v8_monolith.7z
              Write-Host "V8 extracted successfully in $target_dir."
          } else {
              Write-Host "v8_monolith.7z not found. Skipping or already handled."
          }

      - name: Generate Visual Studio Solution
        run: |
          cd paint
          ..\base\make

      - name: Compile ArmorPaint (MSBuild)
        run: |
          cd build
          msbuild ArmorPaint.sln /p:Configuration=Release /p:Platform=x64

      - name: Assemble Ready-to-Run Package
        shell: powershell
        run: |
          # Створюємо чисту фінальну папку для дистрибутива
          New-Item -ItemType Directory -Force -Path "dist/ArmorPaint"

          # Копіюємо зкомпільований .exe файл програми
          if (Test-Path -Path "build/x64/Release/ArmorPaint.exe") {
              Copy-Item -Path "build/x64/Release/ArmorPaint.exe" -Destination "dist/ArmorPaint/ArmorPaint.exe"
          } else {
              # Фолбек, якщо exe зберігся під старою назвою рушія Krom
              Copy-Item -Path "build/x64/Release/Krom.exe" -Destination "dist/ArmorPaint/ArmorPaint.exe"
          }

          # Копіюємо весь необхідний контент програми (скрипти, інтерфейс, шейдери)
          if (Test-Path -Path "build/krom") {
              Copy-Item -Path "build/krom/*" -Destination "dist/ArmorPaint" -Recurse -Force
          }

          Write-Host "Assembly completed successfully. Artifact is ready!"

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-Ready
          path: dist/ArmorPaint/
